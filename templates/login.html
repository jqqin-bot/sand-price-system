<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>股东登录 - 砂石报价系统</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="card login"><h1>砂石报价系统 · 股东登录</h1>
<div class="hint">演示账号：手机号 <b>13800000000</b>，验证码 <b>123456</b>（演示模式，不发送真实短信）</div>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><label>手机号</label><input name="phone" id="phone" maxlength="11" placeholder="请输入手机号" required>
<label>验证码</label><div class="row"><input name="code" maxlength="6" placeholder="请输入验证码" required>
<button type="button" id="sendBtn">获取验证码</button></div>
<button class="full" type="submit">登录</button></form><p id="msg" class="meta"></p></div>
<script>document.getElementById('sendBtn').onclick=async()=>{const r=await fetch('/send_code',{method:'POST'});const j=await r.json();document.getElementById('msg').textContent=j.msg;};</script>
</body></html>
